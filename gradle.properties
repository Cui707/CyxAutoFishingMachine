# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Fabric Properties
# 版本对照：https://fabricmc.net/develop
# 与前置 Mod CrimsonCopperGrid 完全对齐 —— Yarn 没有 26.3 的映射，
# 因此 Loom 1.18 默认使用 Mojang 官方映射，本文件同样不声明 mappings 行。
minecraft_version=26.3
loader_version=0.19.5
loom_version=1.18-SNAPSHOT

# 本机网络：Maven 仓库需要经过本地代理访问，直连会失败。
# 代理**不要写在这个文件里**（它会被提交，CI 上没有 127.0.0.1:7890）。
# 请写到用户级配置 ~/.gradle/gradle.properties：
#   systemProp.https.proxyHost=127.0.0.1
#   systemProp.https.proxyPort=7890
#   systemProp.http.proxyHost=127.0.0.1
#   systemProp.http.proxyPort=7890

# Mod Properties
version=1.0.0
group=com.cyx.cyxautofishingmachine
archives_base_name=cyxautofishingmachine

# Dependencies
fabric_api_version=0.161.0+26.3
# Team Reborn Energy —— 与 TechReborn、CrimsonCopperGrid 同一套能量 API。
# 运行时由 CrimsonCopperGrid 内嵌（JiJ）提供，这里只是为了编译期能解析 team.reborn.energy.*
energy_version=5.0.0
# 前置 Mod：CrimsonCopperGrid 尚未发布到任何 Maven 仓库，只能以本地 jar 依赖。
# 期望位置（按顺序查找）：
#   1. libs/crimsoncoppergrid-<版本>.jar
#   2. ../CrimsonCopperGrid/build/libs/crimsoncoppergrid-<版本>.jar
ccg_version=1.1.0
