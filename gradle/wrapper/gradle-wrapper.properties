distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# Gradle 9.8.0 起才支持在 Java 27 上运行（官方兼容性矩阵：Java 27 -> 9.8.0 and after）
distributionUrl=https\://services.gradle.org/distributions/gradle-9.8.0-bin.zip
distributionSha256Sum=bafd5ce9cfaea0fbccfdc8439a1ac42fbd4cd9c89dc9a988228d8a2639a58e6c
networkTimeout=300000
retries=2
retryBackOffMs=1000
# 本机若需要走代理才能访问 services.gradle.org，**不要**把代理写在这里 ——
# 这个文件会被提交，CI 上会因此连不上网（Connection refused）。
# 分发已经是本地缓存时无需任何配置；需要重新下载时用环境变量临时指定即可：
#   JAVA_TOOL_OPTIONS="-Dhttps.proxyHost=127.0.0.1 -Dhttps.proxyPort=7890"
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
